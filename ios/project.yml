# FleetView for iOS — generate the Xcode project with:  xcodegen generate
# (the .xcodeproj is a build artifact; this file is the source of truth).
name: FleetView
options:
  bundleIdPrefix: com.robertcorrado
  deploymentTarget:
    iOS: "17.0" # WKWebsiteDataStore(forIdentifier:) — one cookie jar per machine
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: Z778754952
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FleetView:
    type: application
    platform: iOS
    sources: [FleetView]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertcorrado.fleetview
        PRODUCT_NAME: FleetView
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: FleetView/Info.plist
      properties:
        CFBundleDisplayName: FleetView
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        # iPhone: portrait only (landscape squeezed the UI into a short strip).
        # iPad keeps every orientation — Apple expects that of iPad apps.
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Lets a machine on the local network (http://mymac.local:4280) load too.
        # Tailnet hosts are real HTTPS and need no exception.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Attach a photo to a message for an agent.
        NSPhotoLibraryUsageDescription: Attach images to a message for an agent.
    entitlements:
      path: FleetView/FleetView.entitlements
      properties:
        # Xcode rewrites this to "production" when exporting for TestFlight.
        aps-environment: development
  FleetViewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FleetViewUITests]
    dependencies:
      - target: FleetView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertcorrado.fleetview.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FleetView:
    build:
      targets:
        FleetView: all
        FleetViewUITests: [test]
    test:
      targets: [FleetViewUITests]

