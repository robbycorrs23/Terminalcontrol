name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Typecheck (vite build does NOT typecheck)
        run: npm run typecheck
      - name: Build client
        run: npm run build
      - name: Syntax-check server + scripts
        run: for f in server/*.js scripts/*.js; do node --check "$f"; done
